<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PO Review Detail | RichLand Ops</title>
<style>
:root{
  --bg:#f4f6f3;
  --surface:#ffffff;
  --surface-soft:#f7faf7;
  --line:#d8dfd8;
  --line-strong:#c5d0c7;
  --text:#13201a;
  --muted:#607068;
  --muted-strong:#3b4d44;
  --accent:#1f6b52;
  --accent-soft:#e3efe8;
  --danger:#8c3b32;
  --danger-soft:#faefed;
  --warning:#8a5a16;
  --warning-soft:#fff7eb;
  --good:#21553f;
  --good-soft:#edf8f1;
  --shadow:0 18px 48px rgba(19,32,26,.08);
  --radius-xl:30px;
  --radius-lg:24px;
  --radius-md:18px;
  --wrap:1320px;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:"Avenir Next","Segoe UI",Arial,sans-serif;
  color:var(--text);
  line-height:1.55;
  background:linear-gradient(180deg,#fafbf9 0%,#f4f6f3 24%,#eef3ee 100%);
}
a{color:inherit;text-decoration:none}
.page-shell{max-width:var(--wrap);margin:0 auto;padding:20px 20px 72px}
.topbar{
  display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:22px;padding:18px 22px;
  border:1px solid var(--line);border-radius:22px;background:rgba(255,255,255,.95);box-shadow:0 10px 28px rgba(19,32,26,.05)
}
.brand{display:flex;align-items:center;gap:14px}
.brand-logo{width:56px;height:auto;object-fit:contain}
.brand-copy strong{display:block;font-size:15px;font-weight:800;letter-spacing:-.02em}
.brand-copy span{display:block;margin-top:3px;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.top-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.top-actions a,.top-actions button,.role-pill{
  display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:0 16px;border:1px solid var(--line-strong);
  border-radius:999px;background:var(--surface);color:var(--muted-strong);font:inherit;font-size:13px;font-weight:700
}
.role-pill{gap:8px;padding:0 10px 0 14px}
.role-pill span{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.role-pill strong{font-size:13px;font-weight:800;color:var(--text)}
.top-actions button.is-primary{
  border-color:transparent;background:linear-gradient(180deg,#247154 0%,#1f6b52 100%);color:#f5f8f4;box-shadow:0 14px 28px rgba(31,107,82,.18)
}
.panel{border:1px solid var(--line);border-radius:var(--radius-xl);background:var(--surface);box-shadow:var(--shadow)}
.hero-panel{padding:32px;margin-bottom:20px}
.section-kicker{
  display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;background:var(--accent-soft);
  color:var(--accent);font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase
}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(320px,.92fr);gap:26px;align-items:start}
.hero-copy{display:grid;gap:12px}
.hero-copy h1{margin:0;font-size:clamp(34px,4vw,54px);line-height:1.02;letter-spacing:-.05em}
.hero-copy p{margin:0;max-width:64ch;color:var(--muted);font-size:15px;line-height:1.76}
.hero-meta{display:grid;gap:14px;padding:22px;border:1px solid var(--line);border-radius:26px;background:linear-gradient(180deg,#fbfcfb 0%,#eff5f0 100%)}
.hero-meta-row{display:flex;justify-content:space-between;gap:14px}
.hero-meta-row span:first-child{color:var(--muted);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.hero-meta-row span:last-child{color:var(--muted-strong);font-size:14px;text-align:right}
.detail-grid{display:grid;grid-template-columns:minmax(0,1.06fr) minmax(340px,.94fr);gap:18px}
.detail-stack{display:grid;gap:18px}
.card-panel{padding:24px}
.card-head{display:grid;gap:8px;margin-bottom:16px}
.card-head h2{margin:0;font-size:24px;line-height:1.08;letter-spacing:-.04em}
.card-head p{margin:0;color:var(--muted);font-size:14px;line-height:1.7}
.meta-list{display:grid;gap:12px}
.meta-row{display:flex;justify-content:space-between;gap:14px;padding-bottom:12px;border-bottom:1px solid #edf2ed}
.meta-row:last-child{padding-bottom:0;border-bottom:0}
.meta-row span:first-child{color:var(--muted);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.meta-row span:last-child{color:var(--muted-strong);font-size:14px;text-align:right}
.line-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.mini-card{
  padding:18px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(180deg,#ffffff 0%,#f8faf8 100%)
}
.mini-card strong{display:block;margin-bottom:8px;font-size:14px;letter-spacing:-.01em}
.mini-card p{margin:0;color:var(--muted);font-size:13px;line-height:1.68}
.timeline{display:grid;gap:12px}
.timeline-item{
  padding:16px 18px;border:1px solid var(--line);border-radius:18px;background:var(--surface-soft)
}
.timeline-item strong{display:block;margin-bottom:6px;font-size:14px}
.timeline-item p{margin:0;color:var(--muted);font-size:13px;line-height:1.65}
.timeline-item span{display:block;margin-top:8px;color:var(--muted);font-size:12px}
.decision-box{
  display:grid;gap:14px;padding:22px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(180deg,#ffffff 0%,#f6faf6 100%)
}
.decision-box h2{margin:0;font-size:24px;line-height:1.08;letter-spacing:-.04em}
.decision-box p{margin:0;color:var(--muted);font-size:14px;line-height:1.7}
.decision-box textarea{
  width:100%;min-height:136px;padding:14px 16px;border:1px solid var(--line-strong);border-radius:18px;background:#fff;
  color:var(--text);font:inherit;font-size:14px;resize:vertical
}
.decision-actions{display:flex;gap:10px;flex-wrap:wrap}
.decision-actions button{
  display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line-strong);
  background:#fff;color:var(--muted-strong);font:inherit;font-size:13px;font-weight:800;cursor:pointer
}
.decision-actions button[data-decision="approve"]{background:var(--accent);border-color:transparent;color:#f5f8f4}
.decision-actions button[data-decision="hold"]{background:var(--warning-soft);border-color:#f0dcb7;color:var(--warning)}
.decision-actions button[data-decision="reject"]{background:var(--danger-soft);border-color:#ebc3bd;color:var(--danger)}
.message-box{
  padding:16px 18px;border-radius:18px;font-size:13px;line-height:1.65;display:none
}
.message-box.is-visible{display:block}
.message-box.is-good{background:var(--good-soft);color:var(--good)}
.message-box.is-warning{background:var(--warning-soft);color:var(--warning)}
.message-box.is-danger{background:var(--danger-soft);color:var(--danger)}
.empty-state{
  padding:20px;border:1px dashed var(--line-strong);border-radius:20px;background:linear-gradient(180deg,#fcfdfc 0%,#f5f8f5 100%);
  color:var(--muted);font-size:14px;line-height:1.68
}
@media (max-width:1120px){
  .hero-grid,.detail-grid,.line-grid{grid-template-columns:1fr}
}
@media (max-width:760px){
  .page-shell{padding:14px 14px 56px}
  .topbar,.hero-panel,.card-panel{padding:22px}
}
</style>
</head>
<body data-page="internal-po-review">
<div class="page-shell">
  <header class="topbar">
    <a class="brand" href="internal-portal.html" aria-label="Internal portal">
      <img class="brand-logo" src="assets/LOGO/Company-Logo.webp" alt="RichLand Ltd. logo">
      <div class="brand-copy"><strong>RichLand Ops</strong><span>PO Review Detail</span></div>
    </a>
    <div class="top-actions">
      <button type="button" data-internal-lang-toggle>中文</button>
      <a href="internal-portal.html">Back to Queue</a>
      <div class="role-pill" aria-label="Logged in internal role">
        <span>Signed in</span>
        <strong data-session-role>Loading…</strong>
      </div>
      <button type="button" data-detail-refresh class="is-primary">Refresh</button>
      <button type="button" data-detail-logout>Logout</button>
    </div>
  </header>

  <div data-detail-shell>
    <div class="empty-state">Loading PO review detail…</div>
  </div>
</div>
<script src="scripts/site-config.js"></script>
<script src="scripts/internal-i18n.js"></script>
<script src="scripts/internal-auth.js"></script>
<script src="scripts/internal-po-review.js"></script>
</body>
</html>
