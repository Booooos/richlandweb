<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inquiry Detail | RichLand Ops</title>
<style>
:root{
  --bg:#f4f6f3;--surface:#ffffff;--surface-soft:#f7faf7;--line:#d8dfd8;--line-strong:#c5d0c7;
  --text:#13201a;--muted:#607068;--muted-strong:#3b4d44;--accent:#1f6b52;--accent-soft:#e3efe8;
  --shadow:0 18px 48px rgba(19,32,26,.08);--radius-xl:30px
}
*{box-sizing:border-box}
body{margin:0;font-family:"Avenir Next","Segoe UI",Arial,sans-serif;color:var(--text);line-height:1.55;background:linear-gradient(180deg,#fafbf9 0%,#f4f6f3 24%,#eef3ee 100%)}
a{color:inherit;text-decoration:none}
.page-shell{max-width:1320px;margin:0 auto;padding:20px 20px 72px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:22px;padding:18px 22px;border:1px solid var(--line);border-radius:22px;background:rgba(255,255,255,.95);box-shadow:0 10px 28px rgba(19,32,26,.05)}
.brand{display:flex;align-items:center;gap:14px}.brand-logo{width:56px;height:auto;object-fit:contain}.brand-copy strong{display:block;font-size:15px;font-weight:800}.brand-copy span{display:block;margin-top:3px;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.top-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.top-actions a,.top-actions button,.role-pill{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:0 16px;border:1px solid var(--line-strong);border-radius:999px;background:var(--surface);color:var(--muted-strong);font:inherit;font-size:13px;font-weight:700}
.role-pill{gap:8px;padding:0 10px 0 14px}.role-pill span{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}.role-pill strong{font-size:13px;font-weight:800;color:var(--text)}
.panel{border:1px solid var(--line);border-radius:var(--radius-xl);background:var(--surface);box-shadow:var(--shadow)}
.hero-panel,.card-panel{padding:30px}.hero-panel{margin-bottom:20px}
.section-kicker{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.hero-grid,.detail-grid{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(320px,.92fr);gap:20px}
.hero-copy,.card-head{display:grid;gap:10px}.hero-copy h1,.card-head h2{margin:0;letter-spacing:-.05em;line-height:1.04}.hero-copy h1{font-size:clamp(36px,4.1vw,56px)}.card-head h2{font-size:24px}
.hero-copy p,.card-head p{margin:0;color:var(--muted);font-size:14px;line-height:1.74}
.hero-meta,.meta-list,.timeline{display:grid;gap:12px}
.hero-meta{padding:22px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(180deg,#fbfcfb 0%,#eff5f0 100%)}
.meta-row{display:flex;justify-content:space-between;gap:12px;padding-bottom:12px;border-bottom:1px solid #edf2ed}.meta-row:last-child{padding-bottom:0;border-bottom:0}.meta-row span:first-child{color:var(--muted);font-size:12px;letter-spacing:.06em;text-transform:uppercase}.meta-row span:last-child{color:var(--muted-strong);font-size:14px;text-align:right}
.detail-grid{align-items:start}.detail-stack{display:grid;gap:18px}
.line-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.mini-card,.timeline-item{padding:18px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(180deg,#ffffff 0%,#f8faf8 100%)}
.mini-card strong,.timeline-item strong{display:block;margin-bottom:8px;font-size:14px}.mini-card p,.timeline-item p{margin:0;color:var(--muted);font-size:13px;line-height:1.68}.timeline-item span{display:block;margin-top:8px;color:var(--muted);font-size:12px}
.empty-state{padding:20px;border:1px dashed var(--line-strong);border-radius:20px;background:linear-gradient(180deg,#fcfdfc 0%,#f5f8f5 100%);color:var(--muted);font-size:14px;line-height:1.68}
@media (max-width:1120px){.hero-grid,.detail-grid,.line-grid{grid-template-columns:1fr}}
</style>
</head>
<body data-page="internal-inquiry">
<div class="page-shell">
  <header class="topbar">
    <a class="brand" href="internal-portal.html" aria-label="Internal portal">
      <img class="brand-logo" src="assets/LOGO/Company-Logo.webp" alt="RichLand Ltd. logo">
      <div class="brand-copy"><strong>RichLand Ops</strong><span>Inquiry Detail</span></div>
    </a>
    <div class="top-actions">
      <button type="button" data-internal-lang-toggle>中文</button>
      <a href="internal-portal.html">Back to Queue</a>
      <div class="role-pill"><span>Signed in</span><strong data-session-role>Loading…</strong></div>
      <button type="button" data-detail-refresh>Refresh</button>
      <button type="button" data-detail-logout>Logout</button>
    </div>
  </header>
  <div data-detail-shell><div class="empty-state">Loading inquiry detail…</div></div>
</div>
<script src="scripts/site-config.js"></script>
<script src="scripts/internal-i18n.js"></script>
<script src="scripts/internal-auth.js"></script>
<script src="scripts/internal-inquiry.js"></script>
</body>
</html>
